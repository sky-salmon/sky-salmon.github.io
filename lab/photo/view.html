<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>牆角的巫師帽</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chiron+GoRound+TC:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout: the 3D view fills the screen; a name tag top-left and one control bar bottom-right float over it, like a
   photo-mode overlay. One dusk palette taken from the scene (olive sky, warm lamp), the same in light and dark. */
:root {
  --night: #1b1912;          /* behind the canvas while it loads */
  --glass: rgba(27, 25, 18, 0.66);
  --glass-hi: rgba(46, 42, 30, 0.8);
  --cream: #f3ead8;          /* text */
  --cream-soft: #cfc4ab;
  --line: rgba(243, 234, 216, 0.16);
  --ember: #ffad5c;          /* the lamp's colour: focus, pressed state, progress */
  --round: "Chiron GoRound TC", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
  --ui: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--night); color: var(--cream); font: 400 14px/1.5 var(--ui); overflow: hidden; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; cursor: grab; outline: none; }
#stage canvas:active { cursor: grabbing; }

.tag {
  position: fixed; top: calc(14px + env(safe-area-inset-top, 0px)); left: calc(14px + env(safe-area-inset-left, 0px));
  max-width: min(320px, calc(100vw - 28px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)));
  padding: 10px 14px 11px; border-radius: 14px; background: var(--glass); border: 1px solid var(--line);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.tag h1 { margin: 0; font: 700 17px/1.25 var(--round); letter-spacing: 0.02em; text-wrap: balance; }
.tag p { margin: 3px 0 0; color: var(--cream-soft); font-size: 12.5px; transition: opacity 0.6s ease; }
.tag p.gone { opacity: 0; }

.bar {
  position: fixed; right: calc(14px + env(safe-area-inset-right, 0px)); bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px;
  max-width: calc(100vw - 28px - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
}
.bar button {
  appearance: none; border: 1px solid var(--line); background: var(--glass); color: var(--cream);
  font: 500 13.5px/1 var(--round); padding: 11px 14px; border-radius: 999px; cursor: pointer;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); display: inline-flex; align-items: center; gap: 7px;
}
.bar button:hover { background: var(--glass-hi); }
.bar button:focus-visible { outline: 2px solid var(--ember); outline-offset: 2px; }
.bar button[aria-pressed="true"] { border-color: var(--ember); color: var(--ember); }
.bar svg { width: 16px; height: 16px; flex: none; }

.veil {
  position: fixed; inset: 0; display: grid; place-items: center; background: var(--night);
  transition: opacity 0.7s ease; padding: 0 max(16px, env(safe-area-inset-left, 0px)) 0 max(16px, env(safe-area-inset-right, 0px));
}
.veil.done { opacity: 0; pointer-events: none; }
.veil-box { display: grid; gap: 12px; justify-items: center; text-align: center; max-width: 30ch; }
.veil-box strong { font: 700 16px/1.3 var(--round); }
.veil-box span { color: var(--cream-soft); font-size: 13px; }
.meter { width: 180px; max-width: 100%; height: 3px; border-radius: 3px; background: var(--line); overflow: hidden; }
.meter i { display: block; height: 100%; width: 8%; background: var(--ember); transition: width 0.5s ease; }

@media (prefers-reduced-motion: reduce) { .veil, .tag p, .meter i { transition: none; } }
@media (max-width: 480px) {
  .tag h1 { font-size: 15.5px; }
  .bar button { padding: 10px 12px; font-size: 13px; }
}
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>

</head>
<body>
<div id="stage" aria-label="3D 場景：蹲在磚塔牆角的光之子，可拖曳旋轉"></div>

<header class="tag">
  <h1>牆角的巫師帽</h1>
  <p id="hint">拖曳旋轉 · 雙指或滾輪縮放 · 雙擊回到照片視角</p>
</header>

<nav class="bar" aria-label="視角">
  <button type="button" id="flip" aria-pressed="true">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 1.5v13"/><path d="M5.5 4 1.5 12h4z"/><path d="M10.5 4l4 8h-4z"/></svg>
    左右翻轉
  </button>
  <button type="button" id="reset">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="1.5" y="3.5" width="13" height="10" rx="2"/><circle cx="8" cy="8.5" r="2.6"/><path d="M5.5 3.5 6.5 2h3l1 1.5"/></svg>
    回到照片視角
  </button>
</nav>

<div class="veil" id="veil" role="status" aria-live="polite">
  <div class="veil-box">
    <strong id="veil-title">正在把光之子擺到牆角…</strong>
    <div class="meter"><i id="meter"></i></div>
    <span id="veil-note">載入角色、斗篷和磚牆貼圖</span>
  </div>
</div>

<script>
(() => {
  const veil = document.getElementById('veil'), meter = document.getElementById('meter');
  addEventListener('scene-progress', e => { meter.style.width = Math.round(e.detail * 100) + '%'; });
  addEventListener('scene-ready', () => { meter.style.width = '100%'; setTimeout(() => veil.classList.add('done'), 150); });
  const fail = msg => {
    document.getElementById('veil-title').textContent = '場景沒有載入成功';
    document.getElementById('veil-note').textContent = '重新整理頁面再試一次。（' + String(msg).slice(0, 120) + '）';
  };
  addEventListener('error', e => { if (!veil.classList.contains('done')) fail(e.message); });
  addEventListener('unhandledrejection', e => {
    const m = String(e.reason && e.reason.message || e.reason);
    if (!/WebAssembly|wasm/i.test(m) && !veil.classList.contains('done')) fail(m);   // the unused mesh decoder may be refused; that is fine
  });
  const hint = document.getElementById('hint');
  addEventListener('scene-touched', () => setTimeout(() => hint.classList.add('gone'), 2500), { once: true });
  const flip = document.getElementById('flip');
  addEventListener('scene-mirror', e => flip.setAttribute('aria-pressed', String(e.detail)));
  flip.addEventListener('click', () => window.__view && window.__view.mirror());
  document.getElementById('reset').addEventListener('click', () => window.__view && window.__view.reset());
})();
</script>
<script type="module">
// the matched shot (cfg_v2.json) and the outfit (look.json), opened as a live view you can turn
const [cfg, look] = await Promise.all(['cfg_v2.json', 'look.json'].map(f => fetch(f).then(r => r.json())));
delete cfg.w; delete cfg.h;
window.__CFG = { ...cfg, live: true, mirror: true, envBase: 'env/', avatarBase: '../../assets/avatar/', lazyFile: '../../lab/photo/lazy.glb' };
window.__LOOK = look;
await import('./scene.mjs');
</script>
</body>
</html>
