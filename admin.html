<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>目錄管理 — candle·kit</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<!-- The GitHub token lives in this page, so nothing from other sites may run here: no inline or third-party scripts, and the
     only network peer besides this site is api.github.com. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self' https://api.github.com; base-uri 'none'; form-action 'none'">
<meta name="theme-color" content="#101211">
<link rel="icon" href="assets/img/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/css/admin.css">
</head>
<body>
<div class="gate" id="gate">
  <div class="gate-card">
    <h1>目錄管理</h1>
    <p>只有網站擁有者能進來。用 GitHub 權杖登入：它只存在這個瀏覽器，只會送到 GitHub。</p>
    <form id="login" autocomplete="off">
      <label class="field"><span>GitHub 權杖（fine-grained token）</span>
        <input class="input" id="token" type="password" placeholder="github_pat_…" spellcheck="false" autocapitalize="off" required></label>
      <label class="switch"><input type="checkbox" id="remember" checked><span>在這台裝置上記住（關掉分頁也保持登入）</span></label>
      <button class="btn" type="submit" id="login-btn">登入</button>
      <p class="err" id="login-err" role="alert" hidden></p>
    </form>
    <details open>
      <summary>還沒有權杖？</summary>
      <ol>
        <li><a href="https://github.com/settings/personal-access-tokens/new?name=candle-kit%20admin&amp;description=sky-cotl%20%E7%9B%AE%E9%8C%84%E7%AE%A1%E7%90%86%E9%A0%81&amp;target_name=chunhao0613&amp;expires_in=366&amp;contents=write" target="_blank" rel="noopener">開啟已填好的建立頁</a>（名稱、一年期限、Contents 寫入都已設定）。</li>
        <li>Repository access 選 <b>Only select repositories</b> → <code>sky-cotl</code>（只有這項要自己點）。</li>
        <li>按 <b>Generate token</b>，複製後貼到上面，勾著「記住」登入。之後這台裝置就不用再貼。</li>
      </ol>
    </details>
  </div>
</div>

<div class="app" id="app" hidden>
  <header class="bar">
    <div class="brand"><b>目錄管理</b><small>data/seasons.json · items.json · packs.json</small></div>
    <nav class="tabs" role="tablist" aria-label="資料">
      <button class="tab" role="tab" data-tab="seasons" aria-selected="true">季節<span class="n" id="n-seasons"></span></button>
      <button class="tab" role="tab" data-tab="items" aria-selected="false">物品<span class="n" id="n-items"></span></button>
      <button class="tab" role="tab" data-tab="packs" aria-selected="false">禮包<span class="n" id="n-packs"></span></button>
    </nav>
    <span class="spacer"></span>
    <span class="who" id="who"></span>
    <button class="changes-btn" id="open-changes" type="button">變更 <span class="count" id="change-count">0</span></button>
  </header>
  <main class="work">
    <section class="list" aria-label="清單">
      <div class="filters" id="filters"></div>
      <div class="rows" id="rows"><p class="loading">載入中…</p></div>
    </section>
    <aside class="editor closed" id="editor" aria-label="編輯"></aside>
  </main>
</div>
<div class="drawer" id="drawer" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="assets/js/admin.js"></script>
</body>
</html>
